<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
      box-sizing: border-box;
      height: 100%;
    }
    .content { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    .footer {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #444;
      margin-top: 12px;
    }
    #content {
      flex: 1;
      resize: none;
      font-family: Arial, sans-serif;
      font-size: 13px;
      min-height: 100px;
      background: #FFFFFF !important;
      color: #000000;
      border: 1px solid #888 !important;
    }
    #content::placeholder { color: #999999; }
  </style>
</head>
<body>
  <div class="content">

    <div style="display:flex; gap:8px; align-items:center">
      <span style="color:#aaa; font-size:11px">Font:</span>
      <select id="font" style="flex:1" onchange="updatePreview()">
        <option>Arial</option>
        <option>Times New Roman</option>
        <option>Calibri</option>
        <option>Verdana</option>
      </select>
      <span style="color:#aaa; font-size:11px">Size (pt):</span>
      <input id="size_pt" type="number" value="10" min="7" max="72" style="width:60px" oninput="updatePreview()">
    </div>

    <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap">
      <button class="fmt-btn" id="bold"    onclick="toggle('bold')">B</button>
      <button class="fmt-btn" id="italic"  onclick="toggle('italic')">I</button>
      <button class="fmt-btn" id="caps"    onclick="toggle('caps')">AA</button>
      <span style="margin:0 6px; border-left:1px solid #555; align-self:stretch"></span>
      <input type="color" id="color" value="#000000" oninput="updatePreview()">
      <span style="margin:0 6px; border-left:1px solid #555; align-self:stretch"></span>
      <button class="fmt-btn" id="align_L" onclick="setAlign('L')" class="active">L</button>
      <button class="fmt-btn" id="align_C" onclick="setAlign('C')">C</button>
      <button class="fmt-btn" id="align_R" onclick="setAlign('R')">R</button>
      <span style="margin:0 6px; border-left:1px solid #555; align-self:stretch"></span>
      <select id="list_style" onchange="onListStyleChange()">
        <option value="none">No List</option>
        <option value="dot">• Dot</option>
        <option value="dash">- Dash</option>
        <option value="number">1. Number</option>
      </select>
    </div>

    <textarea id="content" onkeydown="handleKey(event)"
              placeholder="Enter text here..."></textarea>

  </div>

  <div class="footer">
    <button class="secondary" onclick="sketchup.cancel()">Cancel</button>
    <button onclick="placeText()">Place Text</button>
  </div>

<script>
  var state = { bold: false, italic: false, caps: false, align: 'L' };
  var currentListStyle = 'none';

  function receiveProps(json) {
    if (!json) return;
    var p = (typeof json === 'string') ? JSON.parse(json) : json;
    if (p.font)       document.getElementById('font').value    = p.font;
    if (p.size_pt)    document.getElementById('size_pt').value = p.size_pt;
    if (p.color)      document.getElementById('color').value   = p.color;
    if (p.content)    document.getElementById('content').value = p.content;
    if (p.list_style && p.list_style !== 'none') {
      currentListStyle = p.list_style;
      document.getElementById('list_style').value = p.list_style;
    }
    if (p.bold)    { state.bold   = true; document.getElementById('bold').classList.add('active'); }
    if (p.italic)  { state.italic = true; document.getElementById('italic').classList.add('active'); }
    if (p.is_caps) { state.caps   = true; document.getElementById('caps').classList.add('active'); }
    if (p.align)   setAlign(p.align);
    updatePreview();
  }

  sketchup.get_props();

  function updatePreview() {
    var ta = document.getElementById('content');
    ta.style.fontFamily = document.getElementById('font').value;
    ta.style.fontSize   = document.getElementById('size_pt').value + 'pt';
    ta.style.fontWeight = state.bold   ? 'bold'   : 'normal';
    ta.style.fontStyle  = state.italic ? 'italic' : 'normal';
    ta.style.color      = document.getElementById('color').value;
    ta.style.textTransform = state.caps ? 'uppercase' : 'none';
  }

  function toggle(id) {
    state[id] = !state[id];
    document.getElementById(id).classList.toggle('active', state[id]);
    updatePreview();
  }

  function setAlign(a) {
    state.align = a;
    ['L', 'C', 'R'].forEach(function(x) {
      document.getElementById('align_' + x).classList.toggle('active', x === a);
    });
  }

  // When list style changes, apply/remove prefixes on ALL existing lines immediately
  function onListStyleChange() {
    var newStyle = document.getElementById('list_style').value;
    var ta    = document.getElementById('content');
    var lines = ta.value.split('\n');

    // Strip current prefixes
    lines = lines.map(function(line) {
      if (currentListStyle === 'dot')    return line.replace(/^• /, '');
      if (currentListStyle === 'dash')   return line.replace(/^- /, '');
      if (currentListStyle === 'number') return line.replace(/^\d+\. /, '');
      return line;
    });

    // Apply new prefixes
    lines = lines.map(function(line, i) {
      if (newStyle === 'dot')    return '• ' + line;
      if (newStyle === 'dash')   return '- '      + line;
      if (newStyle === 'number') return (i + 1) + '. ' + line;
      return line;
    });

    ta.value = lines.join('\n');
    currentListStyle = newStyle;
  }

  // On Enter, continue the current list prefix on the next line
  function handleKey(e) {
    if (e.key !== 'Enter' || currentListStyle === 'none') return;
    var ta   = document.getElementById('content');
    var pos  = ta.selectionStart;
    var text = ta.value;
    var linesBefore = text.substring(0, pos).split('\n').length;
    var prefix = currentListStyle === 'dot'    ? '• '
               : currentListStyle === 'dash'   ? '- '
               : linesBefore + '. ';
    e.preventDefault();
    var insert = '\n' + prefix;
    ta.value = text.slice(0, pos) + insert + text.slice(pos);
    ta.selectionStart = ta.selectionEnd = pos + insert.length;
  }

  function placeText() {
    var content = document.getElementById('content').value.trim();
    if (!content) { alert('Please enter some text.'); return; }
    var props = {
      font:       document.getElementById('font').value,
      size_pt:    parseFloat(document.getElementById('size_pt').value),
      color:      document.getElementById('color').value,
      bold:       state.bold,
      italic:     state.italic,
      is_caps:    state.caps,
      align:      state.align,
      list_style: 'none',
      content:    content
    };
    sketchup.place_text(JSON.stringify(props));
  }
</script>
</body>
</html>
